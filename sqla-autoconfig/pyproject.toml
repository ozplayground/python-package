[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqla-autoconfig"
version = "0.1.0"
description = "Database Auto-Configuration and High-Concurrency Connection Pool Manager for Python with SQLAlchemy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Fullstack Team", email = "dev@example.com" }
]
keywords = ["sqlalchemy", "database", "autoconfig", "connection-pool", "asyncio", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

dependencies = [
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.28.0",
]
mysql = [
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
    "cryptography>=41.0.0",
]
mariadb = [
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
]
all = [
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.28.0",
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
    "cryptography>=41.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["sqla_autoconfig"]
